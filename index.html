<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
    <script src="script.js" defer></script>
</head>
<body>
    <header>Welcome to the calculator</header>
    <div id="body" class="calculator">
        <input type="text" id="display" class="calculator">
        <div id="keyboard" class="calculator">
            <div id="numbers" class="calculator">
                <button id="seven" class="calculator numbers buttons">7</button>
                <button id="eight" class="calculator numbers buttons">8</button>
                <button id="nine" class="calculator numbers buttons">9</button>
                <button id="four" class="calculator numbers buttons">4</button>
                <button id="five" class="calculator numbers buttons">5</button>
                <button id="six" class="calculator numbers buttons">6</button>
                <button id="one" class="calculator numbers buttons">1</button>
                <button id="two" class="calculator numbers buttons">2</button>
                <button id="three" class="calculator numbers buttons">3</button>
                <button id="comma" class="calculator numbers buttons">,</button>
                <button id="zero" class="calculator numbers buttons">0</button>
                <button id="equal" class="calculator numbers buttons">=</button>
            </div>
            <div id="operations" class="calculator">
                <div id="top" class="calculator">
                    <button id="del" class="calculator buttons">DEL</button>
                    <button id="ac" class="calculator buttons">AC</button>
                </div>
                <div id="mid" class="calculator">
                    <button id="plus" class="calculator buttons">+</button>
                    <button id="minus" class="calculator buttons">-</button>
                </div>
                <div id="bottom" class="calculator">
                    <button id="multiply" class="calculator buttons">×</button>
                    <button id="divide" class="calculator buttons">/</button>
                    <!-- Add another button to delete one char -->
                </div>
            </div>
        </div>
    </div>
    <footer>
        <h3>@Nedjik07</h3>
        <a href="https://www.theodinproject.com/" target="_blank">The Odin Project</a>
    </footer>
</body>
</html>
