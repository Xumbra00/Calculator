<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
    <script src="script.js" defer></script>
</head>
<body>
    <header>Welcome to the calculator</header>
    <div id="body" class="calculator">
        <div id="display" class="calculator">nigga</div>
        <div id="keyboard" class="calculator">
            <div id="numbers" class="calculator">
                <div id="zero" class="calculator numbers">0</div>
                <div id="two" class="calculator numbers">2</div>
                <div id="one" class="calculator numbers">1</div>
                <div id="three" class="calculator numbers">3</div>
                <div id="four" class="calculator numbers">4</div>
                <div id="five" class="calculator numbers">5</div>
                <div id="six" class="calculator numbers">6</div>
                <div id="seven" class="calculator numbers">7</div>
                <div id="eight" class="calculator numbers">8</div>
                <div id="nine" class="calculator numbers">9</div>
                <div id="comma" class="calculator numbers">,</div>
                <div id="Clear" class="calculator numbers">AC</div>
            </div>
            <div id="operations" class="calculator">
                <div id="top" class="calculator">
                    <div id="plus" class="calculator">+</div>
                    <div id="minus" class="calculator">-</div>
                </div>
                <div id="bottom" class="calculator">
                    <div id="multiply" class="calculator">×</div>
                    <div id="divide" class="calculator">/</div>
                    <div id="equal" class="calculator">=</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
