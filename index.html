<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
    <script src="script.js" defer></script>
</head>
<body>
    <div id="body" class="calculator">this is the calculator
        <div id="display" class="calculator">nigga</div>
        <div id="keyboard" class="calculator">
            <div id="numPad" class="calculator">
                <div id="zero" class="calculator">0</div>
                <div id="one" class="calculator">1</div>
                <div id="two" class="calculator">2</div>
                <div id="three" class="calculator">3</div>
                <div id="four" class="calculator">4</div>
                <div id="five" class="calculator">5</div>
                <div id="six" class="calculator">6</div>
                <div id="seven" class="calculator">7</div>
                <div id="eight" class="calculator">8</div>
                <div id="nine" class="calculator">9</div>
                <div id="comma" class="calculator">,</div>
                <div id="Clear" class="calculator">AC</div>
            </div>
            <div id="operationPad" class="calculator">
                <div>
                    <div id="plus" class="calculator">+</div>
                    <div id="minus" class="calculator">-</div>
                </div>
                <div>
                    <div id="multiply" class="calculator">×</div>
                    <div id="divide" class="calculator">/</div>
                    <div id="equal" class="calculator">=</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
